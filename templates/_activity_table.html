{% if activity %}<div class="tablewrap"><table><thead><tr><th>When (UTC)</th><th>Result</th><th>IP address</th><th>Device</th></tr></thead><tbody>
{% for a in activity %}<tr><td>{{ a.attempted_at }}</td><td>{% if a.success %}<span class="ok">Signed in</span>{% else %}<span class="fail">Failed attempt</span>{% endif %}</td><td>{{ a.ip }}</td><td>{{ a.user_agent|device }}</td></tr>{% endfor %}
</tbody></table></div>{% else %}<p class="empty">No sign-in activity yet.</p>{% endif %}
